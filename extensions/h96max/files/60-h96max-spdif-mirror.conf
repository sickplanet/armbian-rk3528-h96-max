# Mirror the board's analog and HDMI playback to the optical output.
context.modules = [
    { name = libpipewire-module-loopback
      args = {
        node.description = "H96 Max analog to optical"
        capture.props = {
          target.object = "alsa_output.platform-analog-sound.stereo-fallback"
          stream.capture.sink = true
          node.passive = true
          node.dont-fallback = true
          node.linger = true
        }
        playback.props = {
          target.object = "alsa_output.platform-spdif-sound.stereo-fallback"
          node.passive = true
          node.dont-fallback = true
          node.linger = true
        }
      }
    }
    { name = libpipewire-module-loopback
      args = {
        node.description = "H96 Max HDMI to optical"
        capture.props = {
          target.object = "alsa_output.platform-hdmi-sound.stereo-fallback"
          stream.capture.sink = true
          node.passive = true
          node.dont-fallback = true
          node.linger = true
        }
        playback.props = {
          target.object = "alsa_output.platform-spdif-sound.stereo-fallback"
          node.passive = true
          node.dont-fallback = true
          node.linger = true
        }
      }
    }
]
